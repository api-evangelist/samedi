aid: samedi
name: samedi
description: >-
  samedi is a Berlin-based healthcare software provider delivering smart
  scheduling and coordination software for medical practices, clinics and
  hospitals across the DACH region. Its platform covers online appointment
  booking, patient portals, video consultations, digital intake forms, AI phone
  assistance, resource and staff planning, and automated patient communication,
  serving thousands of healthcare institutions. For developers, samedi exposes an
  OAuth2 / OpenID-Connect Booking API and a Portal API, publishes open-source
  FHIR, HL7 and CalDAV integration gateways plus Ruby and PHP reference clients,
  and offers more than 40 interfaces to practice-management (PMS) and
  hospital-information (HIS) systems.
